name: update kollab formula

on:
  repository_dispatch:
    types:
      - pypi-release
  workflow_dispatch:
    inputs:
      version:
        description: Kollab version to publish to the tap (blank = latest on PyPI)
        required: false
        type: string
  schedule:
    # Hourly self-heal: reconcile the formula against PyPI's latest so a missed
    # or permanently-failed release dispatch can never leave the tap stranded.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-kollab-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${DISPATCH_VERSION:-$INPUT_VERSION}"
          version="${version#v}"
          if [ -z "$version" ]; then
            # Scheduled run (or blank manual input): self-heal to PyPI's latest.
            version="$(python .github/scripts/update_formula_from_pypi.py --print-latest)"
          fi
          if [ -z "$version" ]; then
            echo "Could not determine a version to publish" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: python .github/scripts/update_formula_from_pypi.py --version "${{ steps.version.outputs.version }}"

      - name: Check Ruby syntax
        run: ruby -c Formula/kollab.rb

      # Commit straight to main when the formula actually changed. The push
      # triggers brew test-bot (tests.yml) for full macOS install validation.
      # The generator is deterministic (sorted resources) so an unchanged
      # version is a no-op and the hourly schedule never churns.
      - name: Commit if changed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git diff --quiet -- Formula/kollab.rb; then
            echo "Formula already points at $VERSION; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kollab.rb
          git commit -m "Update kollab to $VERSION"
          git push origin HEAD:main
          echo "Committed kollab $VERSION (push triggers brew test-bot for macOS validation)."
